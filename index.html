<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dolomites Trip Dashboard</title>
  <meta name="theme-color" content="#1f6feb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dolomites" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #18212b;
      --muted: #627080;
      --line: #dde3ea;
      --accent: #1f6feb;
      --accent-soft: #eaf2ff;
      --good: #2f855a;
      --warn: #b7791f;
      --bad: #c53030;
      --shadow: 0 8px 30px rgba(17, 24, 39, 0.08);
      --radius: 18px;
      --radius-sm: 12px;
      --max: 1240px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(246, 247, 249, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(221, 227, 234, 0.9);
    }

    .topbar-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .chip-row, .nav-row, .filter-row, .hotel-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-row a, .chip, .segmented button, .small-btn, .day-jump button, .toolbar-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.88rem;
      line-height: 1;
      cursor: pointer;
    }

    .nav-row a.active, .chip.active, .segmented button.active, .small-btn.active, .day-jump button.active, .toolbar-btn.active {
      background: var(--accent-soft);
      border-color: rgba(31, 111, 235, 0.25);
      color: var(--accent);
      font-weight: 600;
    }

    .toolbar-btn {
      cursor: pointer;
    }

    .top-info-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .info-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 0.8rem;
      background: #eef2f6;
      color: #4c5b6b;
      border: 1px solid #e3e8ef;
      cursor: default;
      user-select: none;
    }

    .info-pill.emphasis {
      background: #eaf2ff;
      color: var(--accent);
      border-color: rgba(31,111,235,0.18);
      font-weight: 600;
    }

    .page {
      max-width: var(--max);
      margin: 0 auto;
      padding: 18px 16px 64px;
    }

    .section {
      margin-top: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-header {
      padding: 18px 20px 0;
    }

    .section-header h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .section-header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .section-body {
      padding: 18px 20px 20px;
    }

    .overview-grid, .cards-grid, .info-grid, .decision-grid, .day-summary-grid {
      display: grid;
      gap: 14px;
    }

    .overview-grid {
      grid-template-columns: 1.2fr 1fr;
    }

    .info-grid.two, .decision-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .cards-grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .cards-grid.two, .day-summary-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .panel, .mini-card, .metric-card, .result-card, .plan-preview, .plan-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 14px;
    }

    .metric-card h3, .panel h3, .result-card h3, .plan-card h4, .day-card h3 {
      margin: 0 0 8px;
    }

    .muted { color: var(--muted); }

    .status-row, .action-row, .tag-row, .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .toolbar-row {
      margin-bottom: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.8rem;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      cursor: default;
      user-select: none;
    }

    .badge.good { background: #edfdf4; color: var(--good); border-color: #b7e4c7; }
    .badge.warn { background: #fff8e6; color: var(--warn); border-color: #f0d9a2; }
    .badge.bad { background: #fff0f0; color: var(--bad); border-color: #f0c3c3; }
    .badge.accent { background: var(--accent-soft); color: var(--accent); border-color: rgba(31,111,235,0.2); }

    .link-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }

    .day-jump {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .day-card {
      border-top: 1px solid var(--line);
      padding: 14px 20px 18px;
    }

    .day-card:first-of-type { border-top: none; }

    .day-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
    }

    .day-head-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .day-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .day-card .summary {
      color: var(--muted);
      font-size: 0.93rem;
    }

    .day-content {
      display: none;
      margin-top: 14px;
    }

    .day-card.open .day-content { display: block; }

    .plan-role {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .plan-role h4 { margin: 0; }

    .plan-list {
      display: grid;
      gap: 12px;
    }

    .plan-card {
      position: relative;
    }

    .plan-card .topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .plan-card .title-block { min-width: 0; }

    .plan-card h4 {
      font-size: 1rem;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .plan-card .one-liner {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .plan-meta {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 10px;
    }

    .plan-meta .mini-card {
      padding: 10px;
      background: #f9fbfc;
    }

    .plan-meta h5 {
      margin: 0 0 6px;
      font-size: 0.86rem;
    }

    .plain-list {
      margin: 8px 0 0 18px;
      padding: 0;
      color: var(--muted);
    }

    .plain-list li { margin: 4px 0; }

    .decision-results {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .result-card h3 {
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .result-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th, td {
      text-align: left;
      vertical-align: top;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 0.92rem;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.84rem;
      background: #fbfcfd;
      position: sticky;
      top: 0;
    }

    details.library-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
      margin-top: 12px;
      overflow: hidden;
    }

    details.library-card summary {
      list-style: none;
      cursor: pointer;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    details.library-card summary::-webkit-details-marker { display: none; }
    .library-body { padding: 0 14px 14px; }

    .toolbar-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .footer-note {
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px dashed var(--line);
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: 0.9rem;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: white;
      color: var(--text);
      font-size: 0.95rem;
    }

    label.field-label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }

    .inline-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .hidden { display: none !important; }

    @media (max-width: 980px) {
      .overview-grid,
      .info-grid.two,
      .decision-grid,
      .cards-grid.two,
      .cards-grid.three,
      .day-summary-grid,
      .plan-meta {
        grid-template-columns: 1fr;
      }

      .topbar-inner { align-items: flex-start; }
      .nav-row { overflow-x: auto; max-width: 100%; }
      .section-header, .section-body, .day-card { padding-left: 14px; padding-right: 14px; }
      .day-head { flex-direction: column; }
    }
  </style>
</head>

    function getSelectedHotel(base) {
      const selection = state.hotelSelection[base];
      if (selection.customEnabled && selection.customName && (selection.customMapLink || selection.customMapQuery)) {
        const query = selection.customMapQuery || selection.customName;
        return {
          id: 'custom',
          name: selection.customName,
          mapQuery: query,
          mapLink: selection.customMapLink || googleSearchLink(query)
        };
      }
      const preset = data.hotels[base].presetHotels.find(h => h.id === selection.presetId) || data.hotels[base].presetHotels[0];
      return preset;
    }

    function googleSearchLink(query) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
    }

    function googleDirectionsLink({ originQuery, destinationQuery, waypoints = [], travelMode = 'driving' }) {
      const params = new URLSearchParams({ api: '1', origin: originQuery, destination: destinationQuery, travelmode: travelMode });
      if (waypoints.length) params.set('waypoints', waypoints.join('|'));
      return `https://www.google.com/maps/dir/?${params.toString()}`;
    }

    function resolvePlace(id) {
      return data.places[id] || null;
    }

    function buildRouteLink(routeDef) {
      if (!routeDef) return null;
      let originQuery = '';
      let destinationQuery = '';
      const waypoints = [];
      const travelMode = routeDef.travelMode || 'driving';

      if (routeDef.originBase) originQuery = getSelectedHotel(routeDef.originBase).mapQuery;
      if (routeDef.destinationBase) destinationQuery = getSelectedHotel(routeDef.destinationBase).mapQuery;
      if (routeDef.originPlace) originQuery = resolvePlace(routeDef.originPlace)?.mapQuery || '';
      if (routeDef.destination) destinationQuery = resolvePlace(routeDef.destination)?.mapQuery || '';

      if (routeDef.waypoints) {
        routeDef.waypoints.forEach(id => {
          const p = resolvePlace(id);
          if (p) waypoints.push(p.mapQuery);
        });
      }

      if (routeDef.transferBetweenBases) {
        originQuery = getSelectedHotel(routeDef.originBase).mapQuery;
        destinationQuery = getSelectedHotel(routeDef.destinationBase).mapQuery;
      }

      if (!originQuery || !destinationQuery) return null;
      return googleDirectionsLink({ originQuery, destinationQuery, waypoints, travelMode });
    }

    function buildDriveRouteLink(drive) {
      if (!drive) return null;
      const route = drive.route;
      const originBase = route.base || drive.bestBase;
      const originQuery = getSelectedHotel(originBase === 'both' ? state.selectedBase : originBase).mapQuery;
      const wp = (route.waypoints || []).map(id => resolvePlace(id)?.mapQuery).filter(Boolean);
      let destinationQuery = originQuery;
      if (route.destinationBase) destinationQuery = getSelectedHotel(route.destinationBase).mapQuery;
      if (route.returnToOrigin) destinationQuery = originQuery;
      return googleDirectionsLink({ originQuery, destinationQuery, waypoints: wp, travelMode: 'driving' });
    }

    function el(tag, className, html) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (html !== undefined) node.innerHTML = html;
      return node;
    }

      document.getElementById('top-current-base').textContent = `Base: ${data.bases.find(b => b.id === state.selectedBase).label}`;

    function renderControls() {
      const section = sectionShell('controls', 'Current Base & Hotel Controls', 'Base-aware recommendations and hotel-aware routes. Changing a hotel updates route links that start or end there.');
      const body = section.querySelector('.section-body');

    function rankDecisionResults() {
      const candidates = Object.values(data.planCards).filter(plan => {
        if (plan.base === 'both') return true;
        return plan.base === state.selectedBase;
      }).map(plan => {
        const meta = derivePlanMeta(plan);
        let score = 100;
        if (meta.weather.includes(state.selectedWeather)) score += 40;
        if (meta.energy.includes(state.selectedEnergy)) score += 20;
        if (meta.tags.includes(state.selectedVibe)) score += 20;
        if (state.selectedCommitment === 'any' || meta.commitment === state.selectedCommitment) score += 10;
        if (meta.tags.includes('hero_day')) score += 8;
        if (meta.tags.includes('backup')) score += 6;
        if (meta.tags.includes('mixed_weather_ok') && ['mixed_weather', 'bad_weather', 'storm_risk'].includes(state.selectedWeather)) score += 8;
        if (meta.type === 'scenic_drive' && state.selectedVibe === 'scenic_drive_only') score += 15;
        if (meta.type === 'scenic_drive' && !['mixed_weather', 'bad_weather', 'storm_risk', 'scenic_drive_only'].includes(state.selectedWeather)) score -= 18;
        if (meta.commitment === 'must_reserve' && state.selectedCommitment === 'day_of_ok') score -= 15;
        return { ...meta, score };
      }).sort((a, b) => b.score - a.score);

      const pick = predicate => candidates.find(predicate);
      return {
        best: candidates[0],
        alternate: pick(c => c.tags.includes('backup') || c.type === 'hike') || candidates[1],
        bad: pick(c => c.type === 'scenic_drive' || c.weather.includes('bad_weather') || c.weather.includes('mixed_weather')),
        low: pick(c => c.energy.includes('low')),
        wow: pick(c => c.tags.includes('hero_day') || c.tags.includes('dramatic_white_rock'))
      };
    }

    function derivePlanMeta(plan) {
      let tags = [];
      let weather = [];
      let energy = [];
      let commitment = 'day_of_ok';
      let shortReason = plan.summary;
      if (plan.linkedHikes?.length) {
        plan.linkedHikes.forEach(id => {
          const h = data.hikes[id];
          if (!h) return;
          tags = tags.concat(h.tags || []);
          weather = weather.concat(h.weather || []);
          energy = energy.concat(h.energy || []);
          if (h.commitment === 'must_reserve') commitment = 'must_reserve';
          else if (h.commitment === 'reserve_if_possible' && commitment !== 'must_reserve') commitment = 'reserve_if_possible';
        });
      }
      if (plan.linkedDrive) {
        const d = data.drives[plan.linkedDrive];
        tags = tags.concat(d.tags || []);
        weather = weather.concat(d.weather || []);
        energy = energy.concat(d.energy || ['low', 'medium']);
        if (d.commitment) commitment = d.commitment;
      }
      return {
        id: plan.id,
        title: plan.title,
        base: plan.base === 'both' ? state.selectedBase : plan.base,
        weather: [...new Set(weather)],
        energy: [...new Set(energy)],
        tags: [...new Set(tags)],
        commitment,
        type: plan.type,
        reasoning: shortReason
      };
    }

    function decisionTitleForKey(key) {
      return ({ best: 'Best overall match', alternate: 'Best alternate', bad: 'Best bad-weather fallback', low: 'Best low-effort option', wow: 'Best wow-factor option' })[key];
    }

    function scoreLevel(score) {
      if (score >= 175) return 'Excellent';
      if (score >= 150) return 'Strong';
      if (score >= 125) return 'Fair';
      return 'Limited';
    }

    function scoreLevelClass(score) {
      if (score >= 175) return 'good';
      if (score >= 150) return 'accent';
      if (score >= 125) return 'warn';
      return 'bad';
    }

    function matchBreakdown(item) {
      const bits = [`Base: ${baseLabel(item.base)}`];
      if (item.weather.includes(state.selectedWeather)) bits.push('weather matches');
      if (item.energy.includes(state.selectedEnergy)) bits.push('energy matches');
      if (item.tags.includes(state.selectedVibe)) bits.push('vibe matches');
      if (state.selectedCommitment === 'any' || item.commitment === state.selectedCommitment) bits.push('commitment fits');
      return bits.join(' · ');
    }

    function buildQuickActionsForPlan(planId) {
      const plan = data.planCards[planId];
      const actions = [];
      if (plan.linkedHikes?.length) {
        plan.linkedHikes.forEach((hid, idx) => {
          const hike = data.hikes[hid];
          if (hike?.allTrailsUrl) actions.push({ label: idx === 0 ? 'AllTrails' : `AllTrails ${idx + 1}`, href: hike.allTrailsUrl });
        });
      }
      if (plan.linkedDrive) {
        const drive = data.drives[plan.linkedDrive];
        actions.push({ label: 'Drive route', href: buildDriveRouteLink(drive) });
        actions.push({ label: 'Drive details', href: `#drive-${drive.id}` });
      }
      if (plan.accessRoutes?.length) {
        plan.accessRoutes.forEach((route, idx) => {
          const href = buildRouteLink(route);
          if (href) actions.push({ label: route.label || (idx === 0 ? 'Map' : `Map ${idx + 1}`), href });
        });
      }
      return dedupeActions(actions.filter(a => a.href));
    }

    function dedupeActions(items) {
      const seen = new Set();
      return items.filter(i => {
        const key = i.href;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

      section.innerHTML = `
        <div class="section-header">
          <h2>${title}</h2>
          <p>${subtitle}</p>
        </div>
        <div class="section-body"></div>
      `;
      return section;
    }

    function miniCard(title, content) {
      return el('div', 'mini-card', `<h5>${title}</h5><div class="muted">${content}</div>`);
    }

    function listOrText(items) {
      if (!Array.isArray(items)) return items;
      return `<ul class="plain-list">${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
    }

    function linkEl(label, href) {
      const a = document.createElement('a');
      a.href = href;
      if (!href.startsWith('#')) {
        a.target = '_blank';
        a.rel = 'noopener';
      }
      a.textContent = label;
      return a;
    }

    function badge(text, cls = '') {
      return el('span', `badge ${cls}`.trim(), text);
    }

    function labelCommitment(val) {
      return ({ must_reserve: 'Must reserve', reserve_if_possible: 'Better to reserve', day_of_ok: 'Easy day-of', easy_day_of: 'Easy day-of' })[val] || val;
    }

    function renderApplicableTagBadges(weather = [], energy = [], tags = [], commitment = '') {
      const chunks = [];
      weather.forEach(w => chunks.push(`<span class="badge">${humanWeather(w)}</span>`));
      energy.forEach(e => chunks.push(`<span class="badge">${humanEnergy(e)}</span>`));
      if (tags.includes('green_meadows')) chunks.push('<span class="badge">Green meadows + huts</span>');
      if (tags.includes('dramatic_white_rock')) chunks.push('<span class="badge">Dramatic white rock</span>');
      if (tags.includes('church_postcard')) chunks.push('<span class="badge">Church / postcard village</span>');
      if (tags.includes('lake')) chunks.push('<span class="badge">Lake scenery</span>');
      if (tags.includes('scenic_drive_only')) chunks.push('<span class="badge">Scenic drive only</span>');
      if (commitment) chunks.push(`<span class="badge">${labelCommitment(commitment)}</span>`);
      return chunks.join('');
    }

    function humanWeather(id) {
      return ({ bluebird: 'Bluebird', partly_cloudy: 'Partly cloudy', high_clouds_dry: 'High clouds but dry', mixed_weather: 'Mixed weather', bad_weather: 'Bad weather', storm_risk: 'Storm risk' })[id] || id;
    }

    function humanEnergy(id) {
      return ({ high: 'High energy', medium: 'Medium energy', low: 'Low / recovery' })[id] || id;
    }

    function escapeAttr(value) {
      return (value || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    function wireNavActive() {
      const links = [...document.querySelectorAll('.nav-row a')];
      const ids = links.map(a => a.getAttribute('href').slice(1));
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === `#${entry.target.id}`));
          }
        });
      }, { rootMargin: '-25% 0px -60% 0px', threshold: 0.01 });
      ids.forEach(id => {
        const target = document.getElementById(id);
        if (target) observer.observe(target);
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    render();
  </script>
</body>
</html>
